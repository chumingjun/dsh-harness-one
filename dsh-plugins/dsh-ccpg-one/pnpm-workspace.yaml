packages:
  - .

allowBuilds:
  node-pty: true

minimumReleaseAgeExclude:
  - dsh-better-sidebar@0.25.0

# 运行时这些包由 dsh 启动时的扁平兜底（~/.dsh/profiles/node_modules）提供，
# 这里 override 与 sidebar 0.25.0 的 DSH 0.2.0-rc.2 peer 契约对齐。
overrides:
  # npm 发布使用 package.json 的精确版本；源码/release 目录安装则把七个子包解析到
  # 同级目录。setup.sh 发现 vendor sidebar tgz 时会临时追加 file: override。
  "dsh-ccpg-canvasui": "file:../dsh-ccpg-canvasui"
  "dsh-ccpg-document-preview": "file:../dsh-ccpg-document-preview"
  "dsh-ccpg-larkauth": "file:../dsh-ccpg-larkauth"
  "dsh-ccpg-llm-guard": "file:../dsh-ccpg-llm-guard"
  "dsh-ccpg-orchestrator": "file:../dsh-ccpg-orchestrator"
  "dsh-ccpg-tools": "file:../dsh-ccpg-tools"
  "dsh-ccpg-web": "file:../dsh-ccpg-web"
  "@deepseek-ai/dsh-agent": "0.2.0-rc.2"
  "@deepseek-ai/dsh-agent-instructions": "0.2.0-rc.2"
  "@deepseek-ai/dsh-client-locale": "0.2.0-rc.2"
  # Legacy client-runtime has no published 0.2.0-rc.2; it is not a sidebar peer.
  "@deepseek-ai/dsh-client-runtime": "0.1.1-rc.2"
  "@deepseek-ai/dsh-client-ui-conversation": "0.2.0-rc.2"
  "@deepseek-ai/dsh-client-ui-primitives": "0.2.0-rc.2"
  "@deepseek-ai/dsh-client-ui-settings": "0.2.0-rc.2"
  "@deepseek-ai/dsh-client-ui-sidebar": "0.2.0-rc.2"
  "@deepseek-ai/dsh-client-ui-slots": "0.2.0-rc.2"
  "@deepseek-ai/dsh-host-webserver": "0.2.0-rc.2"
  "@deepseek-ai/dsh-invariants": "0.2.0-rc.2"
  "@deepseek-ai/dsh-llm": "0.2.0-rc.2"
  "@deepseek-ai/dsh-session": "0.2.0-rc.2"
  "@deepseek-ai/dsh-settings": "0.2.0-rc.2"
  "@deepseek-ai/dsh-subagent": "0.2.0-rc.2"
  "@deepseek-ai/dsh-tools": "0.2.0-rc.2"
