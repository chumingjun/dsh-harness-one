<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1B1814; --bg-raised: #26221D; --fg: #F5F2EC;
    --fg-muted: #A8A29E; --fg-faint: #6F6A64;
    --agent: #8B5CF6;   --agent-fg: #C4B5FD;
    --cond: #F59E0B;    --cond-fg: #FCD34D;
    --input: #3B82F6;   --input-fg: #60A5FA;
    --output: #10B981;  --output-fg: #6EE7B7;
    --accent: #06B6D4;  --accent-fg: #67E8F9;
  }
  body {
    width: 1280px; height: 640px; overflow: hidden; position: relative;
    font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 460px at 78% 30%, rgba(139,92,246,.13), transparent 62%),
      radial-gradient(800px 400px at 14% 82%, rgba(6,182,212,.09), transparent 60%),
      var(--bg);
    color: var(--fg);
  }
  .dots { position: absolute; inset: 0; z-index: 0;
    background-image: radial-gradient(rgba(245,242,236,.05) 1px, transparent 1.6px);
    background-size: 24px 24px; }
  svg.board { position: absolute; inset: 0; z-index: 1; }

  .fg {
    position: absolute; left: 0; top: 0; bottom: 0; width: 560px; z-index: 5;
    padding: 60px 0 56px 72px;
    display: flex; flex-direction: column;
    background: linear-gradient(90deg, rgba(27,24,20,.55) 0%, rgba(27,24,20,0) 100%);
  }
  .badges { display: flex; gap: 10px; }
  .badge {
    font-size: 14px; font-weight: 600; letter-spacing: .4px; padding: 5px 13px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.14); background: rgba(38,34,29,.8); color: var(--fg-muted);
  }
  .badge.v { color: var(--accent-fg); border-color: rgba(6,182,212,.45); background: rgba(6,182,212,.14); }
  h1 { margin-top: 36px; font-size: 62px; font-weight: 800; line-height: 1.16; letter-spacing: 1px; }
  h1 .grad { background: linear-gradient(100deg, #A78BFA, #67E8F9 80%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 18px; font-size: 20px; color: var(--fg-muted); line-height: 1.8; }
  .sub .pipeline { white-space: nowrap; color: var(--fg); font-weight: 600; letter-spacing: 0; font-size: 18.5px; }
  .sub b { color: var(--fg); font-weight: 650; }
  .sub .hl { color: var(--accent-fg); font-weight: 700; }

  .features { margin-top: 20px; display: flex; gap: 10px; }
  .feat {
    display: flex; align-items: center; gap: 8px;
    font-size: 15.5px; font-weight: 600; color: var(--fg);
    padding: 9px 14px; border-radius: 12px;
    background: rgba(38,34,29,.85); border: 1px solid rgba(255,255,255,.13);
  }
  .feat .ic { font-size: 17px; }

  .foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; font-size: 17px; color: var(--fg-muted); }
  .cmd { font-family: "SF Mono", Menlo, Consolas, monospace; background: #0F0D0B;
    border: 1px solid rgba(255,255,255,.13); padding: 10px 16px; border-radius: 10px;
    font-size: 16px; color: var(--accent-fg); width: fit-content; }
</style>
</head>
<body>
