name: ci

# PR 与 main push 的门禁：全量单测 + 前端双构建验证。
# 单测 = scripts/run-tests.sh（根 npm test 同源，零依赖 node:assert）；
# 构建只验证能产出（产物不入库，release 打包仍走 release.yml 的 pack.sh）。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            dsh-plugins/*/package-lock.json

      - name: install
        run: |
          npm ci --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund
          # orchestrator 自有依赖（ajv/cron-parser/quickjs）+ 单测可达的 dsh SDK。
          # 本地完整 SDK 经 bootstrap-deps.sh 从 dsh 安装软链；CI 用 registry rc 版
          # （lib/index.js import 四个 SDK 包，集成测试真实加载 apply()）。
          # document-preview 依赖由 build-document-preview.sh 自装。
          npm --prefix dsh-plugins/dsh-ccpg-orchestrator install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @deepseek-ai/schemastery @deepseek-ai/dsh-llm @deepseek-ai/dsh-tools @deepseek-ai/dsh-session

      - name: test
        run: npm test

      - name: build
        run: sh dsh-plugins/build-web.sh
        env:
          DSH_NODE: node # 构建链认 DSH_NODE 指向 ≥20 的 node；CI 里就是 node 本身

      - name: verify npm packages
        run: node scripts/verify-plugin-packages.mjs
