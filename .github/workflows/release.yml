name: release

# 打 tag 发版：构建并打包 dsh-ccpg-* 插件，作为 GitHub Release asset 上传。
# 触发：git tag v1.2.3 && git push origin v1.2.3

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack:
    name: pack dsh-plugins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 发版 runner 用 24：boot-smoke 要真起最新 @deepseek-ai/dsh，
          # 其依赖 dsh-session-persistence-jsonl 用 node:zlib 的 zstd API（22.15+ 才有），
          # 22.15 下 boot 即 SyntaxError。仓库 engines 最低支持为 >=22.15。
          node-version: 24.15
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            dsh-plugins/*/package-lock.json

      - name: install dsh (for boot-smoke)
        run: |
          npm i -g @deepseek-ai/dsh pnpm@10.34.5
          npm --prefix web install --no-audit --no-fund

      - name: pack
        run: |
          sh dsh-plugins/pack.sh "$GITHUB_REF_NAME"
          node scripts/verify-plugin-packages.mjs

      - name: boot smoke（安装+启动端到端；验证聚合包钉定的 better-sidebar）
        run: |
          sh dsh-plugins/boot-smoke.sh \
            "dist-release/dsh-ccpg-plugins-$(echo "$GITHUB_REF_NAME" | sed 's/^v//').tar.gz"

      - name: build npm packages（8 包：7 子插件 + 聚合壳）
        run: sh dsh-plugins/publish-npm.sh --dry-run
        env:
          SKIP_BUILD: '1'

      - name: upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/dsh-ccpg-plugins-*.tar.gz
            dist-release/dsh-ccpg-one-*.tgz
          generate_release_notes: true

      # 8 包顺序发布（子插件→聚合壳；已存在版本自动跳过，重跑安全）
      - name: publish npm packages
        run: sh dsh-plugins/publish-npm.sh
        env:
          SKIP_BUILD: '1'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
